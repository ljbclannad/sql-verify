plugins {
    id 'java'
}

dependencies {
    implementation project(':sql-query-contract')
    implementation 'cn.hutool:hutool-all:5.8.25'
    implementation 'com.alibaba.fastjson2:fastjson2:2.0.64'
    implementation 'org.mybatis:mybatis:3.5.16'
    implementation 'com.baomidou:mybatis-plus-core:3.5.7'
    implementation 'com.baomidou:mybatis-plus-extension:3.5.7'
    implementation 'com.github.jsqlparser:jsqlparser:4.9'
    implementation 'org.springframework:spring-core:6.0.21'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.9.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.9.3'
}

apply from: rootProject.file('scripts/sql-export-runtime.gradle')
